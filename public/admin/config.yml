local_backend: true
backend:
  name: proxy
  proxy_url: http://127.0.0.1:8081/api/v1

# Astro 5 standard paths
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# ... (your backend and folder settings)

collections:
  - name: "paquetes"
    label: "Paquetes"
    folder: "src/content/paquetes"
    create: true
    slug: "{{slug}}"               # ← uses slug field if present
    fields:
      - {label: "Título", name: "title", widget: "string", required: true}
      - {label: "Slug (URL)", name: "slug", widget: "string"}   # ← add this!
      - {label: "Imagen", name: "image", widget: "image"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "WhatsApp", name: "whatsapp", widget: "string"}
      
  - name: "servicios"
    label: "Servicios"
    folder: "src/content/servicios"
    create: true
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Imagen", name: "image", widget: "image"} # This creates the "Select Image" button
      - {label: "Descripción", name: "description", widget: "text"}

  - name: "paquetes"
    label: "Paquetes"
    folder: "src/content/paquetes"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string", required: true}
      - {label: "Imagen", name: "image", widget: "image"} # Add this!
      - {label: "Descripción", name: "description", widget: "text"}