backend:
  name: github
  repo: tumundoamedia-oss/tuviajeamedidaonline
  branch: main

media_folder: "public/images/uploads" # Where uploaded images go
public_folder: "/images/uploads"      # Path used in Markdown

collections:
  - name: "ofertas"
    label: "Ofertas"
    folder: "content/ofertas"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "WhatsApp Link", name: "whatsapp", widget: "string"}

  - name: "servicios"
    label: "Servicios"
    folder: "content/servicios"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "WhatsApp Link", name: "whatsapp", widget: "string"}

  - name: "paquetes"
    label: "Paquetes"
    folder: "content/paquetes"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "WhatsApp Link", name: "whatsapp", widget: "string"}
