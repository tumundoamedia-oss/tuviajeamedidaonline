
backend:
  name: github
  repo: tumundoamedia-oss/tuviajeamedidaonline
  branch: main

media_folder: "public/images/uploads" # folder for uploaded images
public_folder: "/images/uploads"

collections:
  - name: "ofertas"
    label: "Ofertas"
    folder: "content/ofertas"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "WhatsApp Link", name: "whatsapp", widget: "string" }

  - name: "servicios"
    label: "Servicios"
    folder: "content/servicios"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Imagen", name: "image", widget: "image" }

  - name: "paquetes"
    label: "Paquetes"
    folder: "content/paquetes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Imagen", name: "image", widget: "image" }


